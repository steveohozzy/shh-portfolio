<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leslie Nielsen Ipsum Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e9eef5;
  --card:#ffffff;
  --text:#0f172a;
  --muted:#64748b;
  --accent:#1d4ed8;
  --accent2:#ef4444;
  --accent3:#e70b84;
}

*{
  box-sizing:border-box
}

body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:linear-gradient(180deg,#dbeafe,#f1f5f9);
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

/* soft “film poster paper” feel */
.wrap{
  width:min(980px,100%);
  background:var(--card);
  border:1px solid rgba(15,23,42,.08);
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 50px rgba(15,23,42,.12);
}

/* title = film header card */
h1{
  margin:0 0 6px;
  font-size:3rem;
  letter-spacing:1px;
  color:#d0045d;
  font-weight: 900;
   font-family:"Bebas Neue", Impact, Arial Black, sans-serif;
}

/* subtitle like studio tagline */
.sub{
  color:var(--muted);
  margin-bottom:22px;
  font-size:.95rem;
}

/* control layout stays clean and “UI panel” */
.controls{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:14px;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:.85rem;
  color:var(--muted);
  margin-bottom:6px;
}

/* clean form fields */
input,select,button{
  width:100%;
  padding:12px 14px;
  border-radius:10px;
  border:1px solid rgba(15,23,42,.12);
  background:#fff;
  color:var(--text);
  font-size:14px;
}

/* primary action button = “film action button” */
button{
  cursor:pointer;
  background:var(--accent);
  color:#fff;
  font-weight:700;
  border:none;
  transition:.15s;
}

button:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

/* secondary buttons */
.actions{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  margin-top:8px;
}

.actions button{
  flex:1;
  background:#0f172a;
}

.actions button:nth-child(2){
  background:var(--accent2);
}

.actions button:nth-child(3){
  background:var(--accent3);
}

/* output = screenplay / script sheet */
#output{
  margin-top:18px;
  background:#f8fafc;
  border:1px solid rgba(15,23,42,.08);
  border-radius:14px;
  padding:18px;
  min-height:260px;
  line-height:1.7;
  white-space:pre-wrap;
}

/* subtle “script header” feel */
#output:before{
  content:"LESNIE NIELSEN IPSUM — SCRIPT OUTPUT";
  display:block;
  font-size:.8rem;
  color:var(--muted);
  margin-bottom:10px;
  letter-spacing:.5px;
}

/* footer note */
.small{
  font-size:.85rem;
  color:var(--muted);
  margin-top:10px;
}
</style>
</head>
<body>
<div class="wrap">
<h1>Leslie Nielsen Films Ipsum</h1>
<div class="sub">Generate placeholder text from iconic lines across Leslie Nielsen's career and famous scenes from his films.</div>
<div class="controls">
<div><label>Paragraphs</label><input id="count" type="number" min="1" max="20" value="4"></div>
<div><label>Sentence Size</label><select id="size"><option value="short">Short</option><option value="medium" selected>Medium</option><option value="long">Long</option></select></div>

</div>
<div class="controls"><div><label>Mode</label><select id="mode"><option value="all">All Quotes</option><option value="airplane">Airplane!</option><option value="nakedgun">Naked Gun</option><option value="policesquad">Police Squad</option><option value="dracula">Dracula</option><option value="business">Corporate Leslie</option><option value="shakespeare">Shakespeare Leslie</option></select></div></div><div class="actions">
<button onclick="generate()">Generate</button>
<button onclick="copyText()">Copy</button><button onclick="copyHTML()">Copy HTML</button>
</div>
<div id="output"></div>
<div class="small">Quotes inspired by roles in Airplane!, Police Squad!, The Naked Gun series, Dracula: Dead and Loving It, Scary Movie films, and more.</div>
</div>
<script>
const quotes = [

/* =========================
   AIRPLANE! (1980)
========================= */
"I am serious... and don't call me Shirley",
"I just want to tell you both good luck. We're all counting on you",
"Good luck. We're all counting on you",
"Yes, Yes, I Remember. I Had Lasagna",
"It's An Entirely Different Kind Of Flying",
"I Haven't Seen Anything Like This Since The Anita Bryant Concert",
"You Can't Take A Guess For Another Two Hours?",
"The Other Two Pilots, They're Just Fine. They're At The Controls Flying The Plane, Free To Pursue A Life Of Religious Fulfillment",
"You can tell me. I'm a doctor.",
"It's a big building with patients, but that's not important right now",
"Flying a plane is no different from riding a bicycle. It's just a lot harder to put baseball cards in the spokes.",
"You'd better tell the Captain we've got to land as soon as we can. This woman has to be gotten to a hospital.",

/* =========================
   POLICE SQUAD! (1982)
========================= */
"Nothing to see here, please disperse",
"Move along, move along",
"Frank Drebin, Police Squad!",
"I only think in emergencies",
"Another routine case gone wrong",
"We're going to need a bigger clue",
"Step aside, this is Police business",
"All units, stand by",
"Don't call me Chief, I'm not a Chief",
"This case is closed. Probably",
"It took me two weeks to find Stella's apartment. She had neglected to give me her address.",
"Sorry, Bobby. No sax before a fight.",
"We're sorry to bother you at a time like this, Mrs. Twice. We would have come earlier, but your husband wasn't dead then.",
"No, I can't say that I do. I did live with a guy once, though, but that was just for a couple of years. Usual slurs, rumours, innuendos - people didn't understand.",
"just a little hunch back at the office",


/* =========================
   THE NAKED GUN (1988)
========================= */
"Nice Party, Hapsburg. I See A Lot Of Familiar Face-Lifts",
"Thank you. I just had it stuffed",
"It's Enrico Pallazzo!",
"I'm a locksmith... and I'm a locksmith",
"A Parachute Not Opening. That's A Way To Die. Getting Caught In The Gears Of A Combine. Having Your Nuts Bit Off By A Laplander. That's The Way I Wanna Go!",
"Take him away and book him",
"Just think, next time I shoot someone I could be arrested",
"Nothing to see here, please disperse",
"Move along, please",
"I've been trained to ignore obvious clues",
"I am detecting something highly suspicious... or lunch",
"Stay calm, this is under control",
"I Just Think About Baseball",
"Well, when I see five weirdos, dressed in togas, stabbing a man in the middle of the park in full view of a hundred people, I shoot the bastards, that's *my* policy!",
"Jane, Since I've Met You, I've Noticed Things That I Never Knew Were There Before. Birds Singing, Dew Glistening On A Newly Formed Leaf, Stoplight",
"You Take A Chance Getting Up In The Morning, Crossing The Street, Or Sticking Your Face In A Fan",
"It's True What They Say: Cops And Women Don't Mix. It's Like Eating A Spoonful Of Drano. Sure, It'll Clean You Out, But It'll Leave You Hollow Inside",
"It's The Same Old Story. Boy Finds Girl, Boy Loses Girl, Girl Finds Boy, Boy Forgets Girl, Boy Remembers Girl, Girl Dies In A Tragic Blimp Accident Over The Orange Bowl On New Year's Day",

/* =========================
   NAKED GUN 2½ (1991)
========================= */
"Like a midget at a urinal, I was going to have to stay on my toes",
"The evidence is pointing everywhere at once",
"This is getting more suspicious by the second",
"I've narrowed it down to everyone",
"I am completely confident in this completely wrong plan",
"I'm Sure That We Can Handle This Situation Maturely, Just Like The Responsible Adults That We Are. Isn't That right, Mr... Poopy Pants?",
"The Truth Hurts, Doesn't It, Hapsburg? Oh, Sure, Maybe Not As Much As Landing On A Bicycle With The Seat Missing, But It Hurts!",
"Awfully big moustache.",
"I'm single! I love being single! I haven't had this much sex since I was a Boy Scout leader!",

/* =========================
   NAKED GUN 33⅓ (1994)
========================= */
"I must warn you, I am highly unstable under pressure",
"This is either a breakthrough or a disaster",
"I feel like I'm missing something obvious",
"I will solve this case or accidentally make it worse",
"Didn't I Try To Adopt That 18-Year-Old Korean Girl",

/* =========================
   DRACULA: DEAD AND LOVING IT (1995)
========================= */
"We would have come earlier, but your husband wasn't dead then",
"I have no idea what I'm doing",
"This castle has very poor lighting",
"I feel strangely underqualified for this",
"Children Of The Night. What A Mess They Make",

/* =========================
   GENERAL LESLIE DEADPAN ENERGY
========================= */
"I've never been more prepared to be unprepared",
"No one tells me anything and I prefer it that way",
"I remain calm while everything collapses",
"This is absolutely normal and definitely not suspicious",
"I am fully trained for situations exactly like this one",
"I will proceed with cautious confusion",
"I have confidence in my confusion",
"I understand nothing, but I understand it confidently",
"This is fine. Everything is fine.",
"I am extremely qualified according to absolutely nobody",
"I was born ready. I just forgot what for",

];

const themed = {
  all: quotes,

  airplane: quotes.filter(q => /airplane|hospiital|bicycle|shirley|flying|good luck|lasagna|important right now|counting on you/i.test(q)),

  policesquad: quotes.filter(q => /police squad|drebin|disperse|move along|clue|emergency|book/i.test(q)),

  nakedgun: quotes.filter(q => /enrico|pallazzo|locksmith|hapsburg|beaver|arrested|clues/i.test(q)),

  nakedgun25: quotes.filter(q => /midget|toes|wrong plan|confident/i.test(q)),

  nakedgun33: quotes.filter(q => /breakthrough|disaster|unstable/i.test(q)),

  dracula: quotes.filter(q => /dracula|castle|dead|husband|night|mess/i.test(q)),

  business: quotes.filter(q => /confusion|fine|prepared|normal|confident/i.test(q))
};

let lastQuote = "";

function rand(arr){
  if(arr.length === 1) return arr[0];

  let q;
  let attempts = 0;

  do {
    q = arr[Math.floor(Math.random()*arr.length)];
    attempts++;
  } while(q === lastQuote && attempts < 10);

  lastQuote = q;
  return q;
}

function pickPool(){
  const m = document.getElementById('mode').value;
  const pool = themed[m];
  return (pool && pool.length) ? pool : quotes;
}

function pickWeighted(){
  const pool=pickPool();
  // bias toward famous lines by duplicating pool lightly
  const boosted=pool.concat(pool.slice(0,Math.floor(pool.length*0.3)));
  return rand(boosted);
}

function sentenceTemplates(q1,q2){
  const templates=[
    `${q1}.`,
    `${q1}, ${q2}.`,
    `${q1} — ${q2}.`,
    `${q1}... ${q2}.`,
  ];
  return templates[Math.floor(Math.random()*templates.length)];
}

function buildSentence(){
  const size=document.getElementById('size').value;
  const count=size==='short'?2:size==='medium'?3:4;
  let q1=pickWeighted();
  let q2=pickWeighted();
  let s=sentenceTemplates(q1,q2);
  if(count>2){
    for(let i=0;i<count-2;i++){
      s+=" " + pickWeighted() + ".";
    }
  }
  return s;
}

function generate(){
  const count=Math.max(1,Math.min(20,parseInt(document.getElementById('count').value)||4));
  let paras=[];

  for(let p=0;p<count;p++){
    lastQuote = "";
    let sentences=2+Math.floor(Math.random()*3);
    let lines=[];
    for(let i=0;i<sentences;i++){
      lines.push(buildSentence());
    }
    paras.push(lines.join(' '));
  }

  document.getElementById('output').textContent=paras.join('\n\n');
}

async function copyHTML(){
  const text=document.getElementById('output').textContent;
  if(!text.trim()){
    alert("Nothing to copy");
    return;
  }

  const paragraphs=text.split(/\n\n+/);

  const html=paragraphs
    .map(p=>{
      const safe=p
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");
      return `<p>${safe}</p>`;
    })
    .join("\n");

  await navigator.clipboard.writeText(html);
  alert("Copied as HTML paragraphs");
}

async function copyText(){
  await navigator.clipboard.writeText(document.getElementById('output').textContent);
  alert('Copied');
}

generate();
</script>
</body>
</html>
